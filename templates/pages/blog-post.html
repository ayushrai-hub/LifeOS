<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="canonical" href="https://blog.example.com/{{SLUG}}/">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:type" content="article">
  <meta property="og:url" content="https://blog.example.com/{{SLUG}}/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <link rel="stylesheet" href="../../styles/main.css">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="layout-document">
    <header class="site-header">
      <p class="site-title"><a href="./index.html">Blog</a></p>
    </header>
    <main id="content">
      <article>
        <h1>{{TITLE}}</h1>
        <p class="meta-row"><time datetime="{{DATE}}">{{DATE_DISPLAY}}</time></p>
        <p class="placeholder">[PLACEHOLDER: essay body]</p>
      </article>
    </main>
    <footer class="site-footer">
      <p><a href="./index.html">Blog</a> · <a href="../www/index.html">Home</a></p>
    </footer>
  </div>
</body>
</html>
