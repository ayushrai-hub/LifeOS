<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}; Talk</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="canonical" href="https://{{HOST}}/talks/{{SLUG}}/">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:type" content="article">
  <meta property="og:url" content="https://{{HOST}}/talks/{{SLUG}}/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <link rel="stylesheet" href="../../../styles/main.css">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="layout-document">
    <header class="site-header">
      <p class="site-title"><a href="../index.html">{{SITE_NAME}}</a></p>
    </header>
    <main id="content">
      <article>
        <h1>{{TITLE}}</h1>
        <p class="meta-row">
          <time datetime="{{DATE}}">{{DATE_DISPLAY}}</time>
          · <span class="placeholder">[PLACEHOLDER: event]</span>
        </p>
        <section>
          <h2>Abstract</h2>
          <p class="placeholder">[PLACEHOLDER]</p>
        </section>
        <section>
          <h2>Artifacts</h2>
          <ul>
            <li class="placeholder">[PLACEHOLDER: slides]</li>
            <li class="placeholder">[PLACEHOLDER: video]</li>
            <li class="placeholder">[PLACEHOLDER: transcript]</li>
          </ul>
        </section>
        <section>
          <h2>Related</h2>
          <p class="placeholder">[PLACEHOLDER: projects, posts]</p>
        </section>
      </article>
    </main>
    <footer class="site-footer">
      <p><a href="../../www/index.html">Home</a></p>
    </footer>
  </div>
</body>
</html>
