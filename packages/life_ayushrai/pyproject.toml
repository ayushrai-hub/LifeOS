[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "life-ayushrai"
version = "1.0.0"
description = "Read Ayush Rai's public knowledge site from Python scripts and agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ayush Rai", email = "ayushrai0211@gmail.com" }]
keywords = ["ayush-rai", "life.ayushrai.site", "nlweb", "cli"]
urls = { Homepage = "https://life.ayushrai.site/", Repository = "https://github.com/ayushrai-hub/LifeOS", Documentation = "https://life.ayushrai.site/developers/" }
dependencies = []

[project.scripts]
life-ayushrai = "life_ayushrai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
