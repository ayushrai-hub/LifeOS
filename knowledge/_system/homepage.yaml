# Homepage editorial contract.
# Consumed by scripts/build-home.js and kept in sync with sites/www/index.html.
# Auto sections merge from knowledge/learning, github index, and site-status.

id: system.homepage
type: system
title: Homepage
slug: homepage
status: review
visibility: public
created: 2026-07-23
updated: 2026-07-23
author: person.owner
version: 0.2.0

name: Ayush Rai

tagline: "I build software, study how systems behave under real constraints, and keep a working record of what I learn."

intro:
  - "This site is my personal knowledge system. When I ship a project, I try to leave a trail of what happened, why it mattered, what broke, and what I would do differently next time. The trail lives in [projects](projects), [engineering](engineering), [artificial intelligence](ai), [research](research), [writing](writing), and [learning](learning). Faceted views sit under [portfolios](portfolios) and [knowledge domains](domains)."
  - "I care about useful software and measurable [impact](impact). I care about products that solve real user and [business](business) problems. I document [systems](systems), [open source](open-source) work, [communities](communities) I take part in, and the slower parts of the path: [reading](reading), [fitness](fitness), a [timeline](timeline), a [gallery](gallery) of photographs, and [resumes](resumes) when a conversation needs a narrower lens."
  - "Deeper pages hold the evidence. Start wherever curiosity points."

